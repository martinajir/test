<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1f1147 0%, #3a1c71 45%, #6a1b9a 100%);
      color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    .hero p {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: #d8d0f0;
      max-width: 40ch;
      margin: 0 auto 2rem;
    }
    .cta {
      display: inline-block;
      padding: 0.9rem 2rem;
      background: #ffffff;
      color: #3a1c71;
      font-weight: 600;
      border-radius: 999px;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: #b7aad6;
    }
  </style>
</head>
<body>
  <main class="hero">
    <h1>Welcome to Test</h1>
    <p>A simple landing page for the martinajir/test project.</p>
    <a class="cta" href="README.md">Learn more</a>
  </main>
  <footer>&copy; 2026 martinajir/test. All rights reserved.</footer>
</body>
</html>
