<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Story Generator</title>
<style>
  :root {
    --bg: #1e1e2f;
    --panel: #2a2a40;
    --accent: #7c5cff;
    --accent-hover: #9377ff;
    --text: #f0f0f5;
    --muted: #a0a0b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1e2f, #2d1e3f);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--text);
    padding: 20px;
  }
  .card {
    background: var(--panel);
    border-radius: 16px;
    padding: 32px;
    max-width: 640px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 {
    margin-top: 0;
    font-size: 1.8rem;
    text-align: center;
  }
  p.subtitle {
    text-align: center;
    color: var(--muted);
    margin-top: -8px;
    margin-bottom: 24px;
  }
  #story {
    background: #14141f;
    border-radius: 10px;
    padding: 20px;
    min-height: 140px;
    line-height: 1.6;
    font-size: 1.05rem;
    white-space: pre-wrap;
  }
  .controls {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  button {
    flex: 1;
    min-width: 140px;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  button:active { transform: scale(0.97); }
  #moreBtn {
    background: var(--accent);
    color: white;
    font-weight: 600;
  }
  #moreBtn:hover { background: var(--accent-hover); }
  #restartBtn {
    background: transparent;
    color: var(--muted);
    border: 1px solid #44445a;
  }
  #restartBtn:hover { color: var(--text); border-color: var(--muted); }
  .word-count {
    text-align: right;
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 10px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>📖 Story Generator</h1>
    <p class="subtitle">Click the button to keep the story going, one burst of words at a time.</p>
    <div id="story"></div>
    <div class="word-count" id="wordCount">0 words</div>
    <div class="controls">
      <button id="moreBtn">More words ✨</button>
      <button id="restartBtn">Start new story</button>
    </div>
  </div>

  <script src="story-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
