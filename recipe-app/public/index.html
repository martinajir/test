<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recipe Collection</title>
<style>
  :root {
    color-scheme: light dark;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    max-width: 760px;
    margin: 0 auto;
    padding: 2rem 1rem 4rem;
    line-height: 1.5;
  }
  h1 { margin-bottom: 0.25rem; }
  .subtitle { color: #666; margin-top: 0; }
  .card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }
  .card h2 { margin-top: 0; }
  .card ul, .card ol { margin: 0.25rem 0; padding-left: 1.25rem; }
  .card .meta { color: #888; font-size: 0.85rem; }
  .card .actions { margin-top: 0.75rem; }
  button {
    cursor: pointer;
    border: 1px solid #ccc;
    background: #f5f5f5;
    border-radius: 6px;
    padding: 0.35rem 0.75rem;
    font-size: 0.85rem;
  }
  button.danger { border-color: #e88; background: #fee; }
  form {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 2rem;
  }
  form label { display: block; margin-top: 0.75rem; font-weight: 600; }
  form input, form textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 0.5rem;
    margin-top: 0.25rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: inherit;
  }
  form textarea { min-height: 90px; }
  form button[type="submit"] {
    margin-top: 1rem;
    background: #2563eb;
    color: white;
    border: none;
    padding: 0.6rem 1.25rem;
  }
  #status { font-size: 0.85rem; color: #b00; }
</style>
</head>
<body>
  <h1>Recipe Collection</h1>
  <p class="subtitle">A simple, database-backed recipe box.</p>

  <form id="recipe-form">
    <h2>Add a recipe</h2>
    <label for="title">Title</label>
    <input id="title" name="title" required placeholder="e.g. Corn Chowder" />

    <label for="ingredients">Ingredients (one per line)</label>
    <textarea id="ingredients" name="ingredients" required placeholder="1 onion, diced&#10;2 cups broth"></textarea>

    <label for="instructions">Instructions (one step per line)</label>
    <textarea id="instructions" name="instructions" required placeholder="Chop the onion.&#10;Simmer for 20 minutes."></textarea>

    <button type="submit">Save recipe</button>
    <div id="status"></div>
  </form>

  <div id="recipes"></div>

  <script>
    const recipesEl = document.getElementById('recipes');
    const form = document.getElementById('recipe-form');
    const statusEl = document.getElementById('status');

    async function loadRecipes() {
      const res = await fetch('/api/recipes');
      const recipes = await res.json();
      recipesEl.innerHTML = recipes.length
        ? recipes.map(renderRecipe).join('')
        : '<p>No recipes yet. Add one above!</p>';
      recipesEl.querySelectorAll('button.danger').forEach((btn) => {
        btn.addEventListener('click', () => deleteRecipe(btn.dataset.id));
      });
    }

    function renderRecipe(r) {
      return `
        <div class="card">
          <h2>${escapeHtml(r.title)}</h2>
          <p class="meta">Added ${new Date(r.created_at).toLocaleString()}</p>
          <strong>Ingredients</strong>
          <ul>${r.ingredients.map((i) => `<li>${escapeHtml(i)}</li>`).join('')}</ul>
          <strong>Instructions</strong>
          <ol>${r.instructions.map((i) => `<li>${escapeHtml(i)}</li>`).join('')}</ol>
          <div class="actions">
            <button class="danger" data-id="${r.id}">Delete</button>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function deleteRecipe(id) {
      if (!confirm('Delete this recipe?')) return;
      await fetch(`/api/recipes/${id}`, { method: 'DELETE' });
      loadRecipes();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = '';
      const title = document.getElementById('title').value;
      const ingredients = document.getElementById('ingredients').value.split('\n').filter((l) => l.trim());
      const instructions = document.getElementById('instructions').value.split('\n').filter((l) => l.trim());

      const res = await fetch('/api/recipes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, ingredients, instructions }),
      });

      if (!res.ok) {
        const err = await res.json();
        statusEl.textContent = err.error || 'Failed to save recipe.';
        return;
      }

      form.reset();
      loadRecipes();
    });

    loadRecipes();
  </script>
</body>
</html>
