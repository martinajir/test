name: PR merge conflict listener

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pr-merge-conflict-listener-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect merge conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted listener code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check pull requests
        uses: actions/github-script@v8
        with:
          script: |
            const listener = require('./.github/scripts/pr-merge-conflict-listener.js');
            await listener({ github, context, core });
