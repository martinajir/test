name: PR merge conflict listener

on:
  pull_request_target:
    types: [edited, opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: merge-conflict-listener-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Inspect pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@v4

      - name: Check merge conflicts
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('${{ github.workspace }}/.github/scripts/pr-merge-conflict-listener.js');
            await run({ github, context, core });
