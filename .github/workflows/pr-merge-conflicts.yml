name: Pull request merge conflicts

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, closed]
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-merge-conflict-listener-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-merge-conflicts:
    name: Check merge conflicts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Update merge conflict notices
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const run = require("./.github/scripts/merge-conflict-listener.js");
            await run({ github, context, core });
