name: Issue opened

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  acknowledge:
    name: Acknowledge new issue
    runs-on: ubuntu-latest
    steps:
      - name: Comment on issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --field body="Thanks for opening this issue! We'll review it soon."
